# Novation Launch Control XL — Crutchfield Machine bindings
#
# Two ways to use this file:
#
#  A) DIRECT MIDI — append these sections to your bindings.ini at
#     ~/Library/Application Support/Crutchfield Machine/bindings.ini
#     The LC XL enumerates as a CoreMIDI device on macOS and the
#     existing MIDI dispatch picks it up.
#
#  B) VIA TOUCHDESIGNER OSC BRIDGE — see development/touchdesigner/
#     for the .toe template. TD reads LC XL via MIDI In CHOP and emits
#     OSC to localhost:7700; Crutchfield receives via the [osc] section
#     in OSC_REFERENCE.md.
#
# This file is the (A) direct-MIDI map for Factory Template 1 (the
# green-LED default). Other LC XL templates use the same CC numbers but
# on different channels — change `ch=9` to whatever your template uses.
#
# LC XL Factory Template 1 layout:
#
#   Send A   (top knob row)        CC 13 14 15 16 17 18 19 20   ch=9
#   Send B   (middle knob row)     CC 29 30 31 32 33 34 35 36   ch=9
#   Pan/Dev  (bottom knob row)     CC 49 50 51 52 53 54 55 56   ch=9
#   Sliders                        CC 77 78 79 80 81 82 83 84   ch=9
#   Track Focus pads (top row)     notes 41 42 43 44 57 58 59 60 ch=9
#   Track Control pads (bot row)   notes 73 74 75 76 89 90 91 92 ch=9
#   Device/Mute/Solo/Record col    notes 105 106 107 108         ch=9
#
# Reference: Novation LC XL Programmer's Reference (focusrite.com).
#
# Notes on flags used below:
#   delta   — knob movement dispatches a +/- nudge per CC tick. Right
#             for STEP actions (chroma+, therm.amp+, brightness+) that
#             don't have an axis variant. The knob acts as an encoder.
#   bipolar — slider 0..1 is remapped to -1..+1. Right for outfade,
#             which centers at 0 = no fade, ±1 = full white/black.

[midi]
port = Launch Control XL
learn = off

# ═════════════════════════════════════════════════════════════════════
# SLIDERS (the 8 vertical faders) — primary performance controls
# ═════════════════════════════════════════════════════════════════════
dyn.decay.axis             = cc:77 ch=9
dyn.external.axis          = cc:78 ch=9
dyn.noise.axis             = cc:79 ch=9
dyn.couple.setAxis         = cc:80 ch=9
outfade.axis               = cc:81 ch=9 bipolar
fx.wet.axis                = cc:82 ch=9
shape.count.axis           = cc:83 ch=9
shape.size.axis            = cc:84 ch=9

# ═════════════════════════════════════════════════════════════════════
# TOP KNOB ROW (Send A) — color / tone setpoints
# ═════════════════════════════════════════════════════════════════════
color.sat.setAxis          = cc:13 ch=9
color.hue.setAxis          = cc:14 ch=9
color.gamma.setAxis        = cc:15 ch=9
color.contrast.setAxis     = cc:16 ch=9
warp.zoom.axis             = cc:17 ch=9 delta
warp.theta.axis            = cc:18 ch=9 delta
optics.blurX.setAxis       = cc:19 ch=9
optics.blurY.setAxis       = cc:20 ch=9

# ═════════════════════════════════════════════════════════════════════
# MIDDLE KNOB ROW (Send B) — optics extras + inject
# ═════════════════════════════════════════════════════════════════════
optics.chroma+             = cc:29 ch=9 delta
shape.rot.axis             = cc:30 ch=9
phys.sensorGamma+          = cc:31 ch=9 delta
phys.satKnee+              = cc:32 ch=9 delta
phys.colorCross+           = cc:33 ch=9 delta
brightness+                = cc:34 ch=9 delta
warp.transX.setAxis        = cc:35 ch=9
warp.transY.setAxis        = cc:36 ch=9

# ═════════════════════════════════════════════════════════════════════
# BOTTOM KNOB ROW (Pan/Device) — thermal + sphere (all delta-nudges)
# ═════════════════════════════════════════════════════════════════════
therm.amp+                 = cc:49 ch=9 delta
therm.scale+               = cc:50 ch=9 delta
therm.speed+               = cc:51 ch=9 delta
therm.rise+                = cc:52 ch=9 delta
therm.swirl+               = cc:53 ch=9 delta
pattern.amount.axis        = cc:54 ch=9
color.hue.axis             = cc:55 ch=9
fx.wet.axis                = cc:56 ch=9

# ═════════════════════════════════════════════════════════════════════
# TRACK FOCUS PADS (top row) — layer toggles
# ═════════════════════════════════════════════════════════════════════
layer.warp                 = note:41 ch=9
layer.optics               = note:42 ch=9
layer.color                = note:43 ch=9
layer.decay                = note:44 ch=9
layer.noise                = note:57 ch=9
layer.couple               = note:58 ch=9
layer.external             = note:59 ch=9
layer.inject               = note:60 ch=9

# ═════════════════════════════════════════════════════════════════════
# TRACK CONTROL PADS (bottom row) — patterns + utilities
# ═════════════════════════════════════════════════════════════════════
pattern.hbars              = note:73 ch=9
pattern.vbars              = note:74 ch=9
pattern.dot                = note:75 ch=9
pattern.checker            = note:76 ch=9
pattern.rings              = note:89 ch=9
pattern.spiral             = note:90 ch=9
pattern.polka              = note:91 ch=9
pattern.starburst          = note:92 ch=9

# ═════════════════════════════════════════════════════════════════════
# RIGHT-SIDE COLUMN (Device / Mute / Solo / Record) — app actions
# ═════════════════════════════════════════════════════════════════════
app.fullscreen             = note:105 ch=9
preset.prev                = note:106 ch=9
preset.next                = note:107 ch=9
app.screenshot             = note:108 ch=9
