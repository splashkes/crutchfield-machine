# Novation Launch Control (original / "v1", 2013-) — Crutchfield Machine bindings
#
# This is the ORIGINAL Launch Control, not the XL or the Mini:
#   - 8 rotary knobs (single row, top of device)
#   - 16 pads (2 rows of 8, labeled 1..8 / 1..8)
#   - 4 side buttons (Up / Down / Left / Right)
#   - 8 Factory Templates + 8 User Templates (tap the Template button to cycle)
#
# Two ways to use this file:
#
#  A) DIRECT MIDI (this map). Append the sections below to your bindings.ini
#     at ~/Library/Application Support/Crutchfield Machine/bindings.ini and
#     plug the controller in. The CoreMIDI backend picks it up automatically.
#
#  B) VIA TOUCHDESIGNER as a MIDI→OSC bridge. See
#     development/touchdesigner/launch_control_xl_bridge.md — the same
#     recipe applies, just substitute LC v1 CCs/notes for LC XL ones.
#
# ─────────────────────────────────────────────────────────────────────────
# FACTORY TEMPLATE 1 (the green-LED default, channel 9)
# ─────────────────────────────────────────────────────────────────────────
# Per Novation's Launch Control Programmer's Reference, Factory Templates
# 1..8 use MIDI channels 9..16 respectively. Knob and pad CC/note numbers
# are template-invariant — only the channel changes.
#
#   Knobs 1..8     CC  21 22 23 24 25 26 27 28   ch=9
#   Pads top row 1..8       notes  9 10 11 12 25 26 27 28   ch=9
#   Pads bottom row 1..8    notes 41 42 43 44 57 58 59 60   ch=9
#   Side Up / Down          notes 114 / 115     ch=9
#   Side Left / Right       notes 116 / 117     ch=9
#
# ⚠ HARDWARE VERIFICATION ⚠
# If a control doesn't behave, run:
#     ./feedback --midi-learn
# and twiddle each control. The actual CCs/notes/channel will print to
# stdout. Replace the numbers below with what your device sends. The 2017
# revision uses the same firmware as the 2013 original, but Novation has
# shipped quiet template-CC re-numberings over the years — trust the
# learn output over this comment block.
#
# To switch templates: hold the Template button and tap pad 1..8 (or
# bottom-row pad for User Templates 1..8). User templates send on
# channels 1..8.

[midi]
port = Launch Control
learn = off

# ═════════════════════════════════════════════════════════════════════
# 8 ROTARY KNOBS — color, tone, optics, warp setpoints
# ═════════════════════════════════════════════════════════════════════
color.sat.setAxis          = cc:21 ch=9
color.hue.setAxis          = cc:22 ch=9
color.gamma.setAxis        = cc:23 ch=9
color.contrast.setAxis     = cc:24 ch=9
dyn.decay.axis             = cc:25 ch=9
dyn.external.axis          = cc:26 ch=9
optics.blurX.setAxis       = cc:27 ch=9
optics.blurY.setAxis       = cc:28 ch=9

# ═════════════════════════════════════════════════════════════════════
# TOP PAD ROW (1..8) — layer toggles
# ═════════════════════════════════════════════════════════════════════
layer.warp                 = note:9  ch=9
layer.optics               = note:10 ch=9
layer.color                = note:11 ch=9
layer.decay                = note:12 ch=9
layer.noise                = note:25 ch=9
layer.couple               = note:26 ch=9
layer.external             = note:27 ch=9
layer.inject               = note:28 ch=9

# ═════════════════════════════════════════════════════════════════════
# BOTTOM PAD ROW (1..8) — patterns + screenshots
# ═════════════════════════════════════════════════════════════════════
pattern.hbars              = note:41 ch=9
pattern.vbars              = note:42 ch=9
pattern.dot                = note:43 ch=9
pattern.checker            = note:44 ch=9
pattern.rings              = note:57 ch=9
pattern.spiral             = note:58 ch=9
app.screenshot             = note:59 ch=9
app.screenshot.hires       = note:60 ch=9

# ═════════════════════════════════════════════════════════════════════
# SIDE BUTTONS — preset navigation + fullscreen
# ═════════════════════════════════════════════════════════════════════
preset.prev                = note:114 ch=9
preset.next                = note:115 ch=9
app.fullscreen             = note:116 ch=9
app.clear                  = note:117 ch=9

# ─────────────────────────────────────────────────────────────────────
# USER TEMPLATE workflow
# ─────────────────────────────────────────────────────────────────────
# If you already have a User Template configured (e.g. from your plug-in
# work), the CC/note numbers will be different and the channel will be
# 1..8 (User 1 = ch 1, etc).
#
# Fastest path:
#   1. Tap Template, select your User Template
#   2. Run: ./feedback --midi-learn
#   3. Touch each control once — note the printed ch=N cc:NN / note:NN
#   4. Copy this section, change channel + numbers to match
#
# Or use TouchDesigner as a bridge so you don't have to re-map at all:
# see development/touchdesigner/launch_control_xl_bridge.md (the recipe
# is the same, just point MIDI In CHOP at "Launch Control").
