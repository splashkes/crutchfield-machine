# TouchDesigner OSC bindings — Crutchfield Machine
#
# Paired with development/touchdesigner/crutchfield_osc_map.json.
# Every channel in the JSON map has a corresponding binding here, so a
# TD OSC Out CHOP with channels named after those addresses will drive
# every parameter shown in the action catalogue.
#
# Append this to your bindings.ini at
# ~/Library/Application Support/Crutchfield Machine/bindings.ini

[osc]
listen = 7700
learn  = off

# ─── continuous (axis) bindings ─────────────────────────────────────
dyn.decay.axis            = osc:/cma/decay
dyn.external.axis         = osc:/cma/external
dyn.noise.axis            = osc:/cma/noise
dyn.couple.setAxis        = osc:/cma/couple
outfade.axis              = osc:/cma/outfade           bipolar
fx.wet.axis               = osc:/cma/fx/wet

color.sat.setAxis         = osc:/cma/sat
color.hue.setAxis         = osc:/cma/hue
color.gamma.setAxis       = osc:/cma/gamma
color.contrast.setAxis    = osc:/cma/contrast

optics.blurX.setAxis      = osc:/cma/blur/x
optics.blurY.setAxis      = osc:/cma/blur/y

warp.zoom.axis            = osc:/cma/zoom              bipolar
warp.theta.axis           = osc:/cma/theta             bipolar
warp.transX.setAxis       = osc:/cma/trans/x           bipolar
warp.transY.setAxis       = osc:/cma/trans/y           bipolar

shape.count.axis          = osc:/cma/shape/count
shape.size.axis           = osc:/cma/shape/size
shape.rot.axis            = osc:/cma/shape/rot
pattern.amount.axis       = osc:/cma/pattern/amount

# ─── layer toggles ──────────────────────────────────────────────────
layer.warp                = osc:/cma/layer/warp
layer.optics              = osc:/cma/layer/optics
layer.color               = osc:/cma/layer/color
layer.decay               = osc:/cma/layer/decay
layer.noise               = osc:/cma/layer/noise
layer.couple              = osc:/cma/layer/couple
layer.external            = osc:/cma/layer/external
layer.inject              = osc:/cma/layer/inject
layer.physics             = osc:/cma/layer/physics
layer.thermal             = osc:/cma/layer/thermal

# ─── pattern selects ────────────────────────────────────────────────
pattern.hbars             = osc:/cma/pattern/hbars
pattern.vbars             = osc:/cma/pattern/vbars
pattern.dot               = osc:/cma/pattern/dot
pattern.checker           = osc:/cma/pattern/checker
pattern.rings             = osc:/cma/pattern/rings
pattern.spiral            = osc:/cma/pattern/spiral
pattern.polka             = osc:/cma/pattern/polka
pattern.starburst         = osc:/cma/pattern/starburst
inject.hold               = osct:/cma/inject/hold

# ─── app actions ────────────────────────────────────────────────────
preset.next               = osc:/cma/preset/next
preset.prev               = osc:/cma/preset/prev
app.screenshot            = osc:/cma/shot
app.screenshot.hires      = osc:/cma/shot/hires
app.fullscreen            = osc:/cma/fullscreen
app.clear                 = osc:/cma/clear
app.pause                 = osc:/cma/pause
