title: Crutchfield Control
pinned: [decay, external, sphereMode, sphereReverb, outFade]

sections:
  - id: pinned
    label: Pinned
    controls: []

  - id: layers
    label: Layers
    visualizer: layers
    controls: [layer.warp, layer.optics, layer.gamma, layer.color, layer.contrast, layer.decay, layer.noise, layer.couple, layer.external, layer.inject, layer.physics, layer.thermal, layer.clip]

  - id: tone
    label: Tone
    controls: [decay, contrast, gamma, satGain, hueRate, outFade, brightness]

  - id: warp
    label: Warp
    controls: [zoom, theta, transX, transY, pivotX, pivotY]

  - id: optics
    label: Optics
    controls: [chroma, blurX, blurY, blurAngle]

  - id: feedback
    label: Feedback
    controls: [external, sourceWet, fxWet, borderSize, borderSoftness, borderDecay, couple, noise]

  - id: physics
    label: Physics
    controls: [invert, sensorGamma, satKnee, colorCross]

  - id: thermal
    label: Thermal
    controls: [thermAmp, thermScale, thermSpeed, thermRise, thermSwirl]

  - id: quality
    label: Quality
    controls: [blurQ, caQ, noiseQ, activeFields, pixelateStyle, pixelateBleed]

  - id: sphere
    label: Sphere
    controls: [sphereMode, sphereReverb, viewRotX, viewRotY]

  - id: inject
    label: Inject
    controls: [pattern, shapeKind, shapeCount, shapeSize, shapeAngle]

  - id: video
    label: Video
    controls: [layer.clip, clipAmount, clipBlend, clipFps]

  - id: vfx
    label: VFX
    controls: [vfx1Slot, vfx1Param, vfx1BSource, vfx2Slot, vfx2Param, vfx2BSource]

  - id: output
    label: Output
    controls: [outFade, brightness, sourceWet, fxWet]
